<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" width="760" height="680" role="img" aria-labelledby="title"><title id="title">Discrete electronic display-switch topology</title><rect width="760" height="680" fill="#ecebdd" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45633c" /></marker></defs><style>text{fill:#293127;font-family:Arial,sans-serif} .box{fill:#f5f3e9;stroke:#87927c;stroke-width:1.5}.line{fill:none;stroke:#45633c;stroke-width:2;marker-end:url(#arrow)} .small{font-size:14px;fill:#606b58}.title{font-size:21px;font-weight:bold}.label{font-size:17px}</style><text x="35" y="42" class="title">Three channels — one X–Y input</text><text x="35" y="68" class="small">BNL EH1-900-2-3 A network · 18 November 1959</text>
<rect x="35" y="105" width="295" height="95" rx="8" class="box" /><text x="55" y="138" class="label">Astable oscillator</text><text x="55" y="166" class="small">2 PNP · cross-coupled 0.5 µF</text>
<rect x="425" y="105" width="300" height="95" rx="8" class="box" /><text x="445" y="138" class="label">Bistable divider</text><text x="445" y="166" class="small">2 PNP · triggered through 1 nF</text><path d="M330 152H425" class="line" />
<rect x="230" y="260" width="300" height="95" rx="8" class="box" /><text x="250" y="293" class="label">Drivers and clamps</text><text x="250" y="321" class="small">5 PNP · phases A, B, C</text><path d="M182 200V230H300V260M575 200V230H460V260" class="line" />
<rect x="230" y="415" width="300" height="95" rx="8" class="box" /><text x="250" y="448" class="label">Six analog keys</text><text x="250" y="476" class="small">6 PNP · X/Y pair per channel</text><path d="M380 355V415" class="line" />
<text x="35" y="442" class="small">Ball X/Y</text><text x="35" y="467" class="small">Net X/Y</text><text x="35" y="492" class="small">Court X/Y</text><path d="M130 463H230" class="line" />
<text x="565" y="452" class="label">Shared X/Y</text><text x="565" y="480" class="small">To oscilloscope</text><path d="M530 463H555" class="line" />
<text x="35" y="560" class="label">15 nonlinear PNP · A–B–A–C selection</text><text x="35" y="594" class="small">Separate bench: nominal +12, +6, −6, −22 V supply ports.</text><text x="35" y="621" class="small">Preliminary 2N140/1N100 models. Structural diagram;</text><text x="35" y="645" class="small">complete connections and values: display-switch.cir.</text></svg>