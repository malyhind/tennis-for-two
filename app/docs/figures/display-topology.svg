<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" width="760" height="680" role="img" aria-labelledby="title"><title id="title">Устройство дискретного электронного переключателя изображения</title><rect width="760" height="680" fill="#ecebdd" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45633c" /></marker></defs><style>text{fill:#293127;font-family:Arial,sans-serif} .box{fill:#f5f3e9;stroke:#87927c;stroke-width:1.5}.line{fill:none;stroke:#45633c;stroke-width:2;marker-end:url(#arrow)} .small{font-size:14px;fill:#606b58}.title{font-size:21px;font-weight:bold}.label{font-size:17px}</style><text x="35" y="42" class="title">Три канала — один X–Y-вход</text><text x="35" y="68" class="small">Топология перенесённого узла BNL EH1-900-2-3 A · 18.11.1959</text>
<rect x="35" y="105" width="295" height="95" rx="8" class="box" /><text x="55" y="138" class="label">Астабильный генератор</text><text x="55" y="166" class="small">2 PNP · перекрёстные 0,5 µF</text>
<rect x="425" y="105" width="300" height="95" rx="8" class="box" /><text x="445" y="138" class="label">Бистабильный делитель</text><text x="445" y="166" class="small">2 PNP · запуск через 1 nF</text><path d="M330 152H425" class="line" />
<rect x="230" y="260" width="300" height="95" rx="8" class="box" /><text x="250" y="293" class="label">Драйверы и ограничители</text><text x="250" y="321" class="small">5 PNP · фазы A, B, C</text><path d="M182 200V230H300V260M575 200V230H460V260" class="line" />
<rect x="230" y="415" width="300" height="95" rx="8" class="box" /><text x="250" y="448" class="label">Шесть аналоговых ключей</text><text x="250" y="476" class="small">6 PNP · по паре X/Y на канал</text><path d="M380 355V415" class="line" />
<text x="35" y="442" class="small">Мяч X/Y</text><text x="35" y="467" class="small">Сетка X/Y</text><text x="35" y="492" class="small">Корт X/Y</text><path d="M130 463H230" class="line" />
<text x="565" y="452" class="label">Общие X/Y</text><text x="565" y="480" class="small">К осциллографу</text><path d="M530 463H555" class="line" />
<text x="35" y="560" class="label">15 нелинейных PNP · выбор A–B–A–C</text><text x="35" y="594" class="small">Питание стенда: идеальные порты +12, +6, −6, −22 V.</text><text x="35" y="621" class="small">Модели 2N140 и 1N100 предварительные. Это схема связей узлов;</text><text x="35" y="645" class="small">полные соединения и номиналы опубликованы в display-switch.cir.</text></svg>